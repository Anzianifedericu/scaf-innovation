<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion — SCAF Innovation</title>
<style>
  :root { --accent:#C1693E; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#2B2620; color:#FBF7EC; padding:calc(1.5rem + env(safe-area-inset-top)) 1.5rem
      calc(1.5rem + env(safe-area-inset-bottom));
    font:16px/1.6 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .b { max-width:24rem; text-align:center; }
  .rond { width:64px; height:64px; margin:0 auto 1.4rem; border-radius:50%;
    background:rgba(234,88,12,.15); display:flex; align-items:center; justify-content:center; }
  svg { width:30px; height:30px; stroke:var(--accent); fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-size:1.25rem; margin:0 0 .6rem; font-weight:600; }
  p { color:#b9ad99; font-size:.94rem; margin:0 0 .5rem; }
  .note { font-size:.82rem; color:#8d8272; margin-top:1.4rem; line-height:1.5; }
  button { margin-top:1.6rem; padding:.8rem 1.6rem; border:0; border-radius:.6rem;
    background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:.94rem;
    cursor:pointer; width:100%; }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
  <div class="b">
    <div class="rond">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Pas de réseau</h1>
    <p>Cette page n'a pas encore été consultée sur cet appareil.</p>
    <p class="note">Les pages déjà consultées restent accessibles hors réseau.
      Celle-ci n'a pas encore été ouverte sur cet appareil.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    // Des que le telephone retrouve du reseau, on repart sans que l'utilisateur
    // ait a toucher l'ecran.
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
