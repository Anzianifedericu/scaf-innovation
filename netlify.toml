# Fonctions serverless — le moteur de chiffrage y est appelé côté serveur
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["nudura-engine.js"]

# URL courte pour les appels Make / Telegram
[[redirects]]
  from = "/api/chiffrage"
  to = "/.netlify/functions/chiffrage-nudura"
  status = 200

# Fonction de generation et lecture de documents
[[redirects]]
  from = "/api/document"
  to = "/.netlify/functions/document"
  status = 200

# Les medias du site sont stockes sur Supabase mais servis sous notre domaine,
# ce qui permet d y appliquer notre propre politique de cache.
[[redirects]]
  from = "/medias/*"
  to = "https://crbvlowxxmspjnyculzl.supabase.co/storage/v1/object/public/site/:splat"
  status = 200
  force = true

# Ces fichiers ne changent jamais : leur nom porte un horodatage.
[[headers]]
  for = "/medias/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
