# Fonctions serverless — le moteur de chiffrage y est appelé côté serveur
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["nudura-engine.js"]

# URL courte pour les appels Make / Telegram
[[redirects]]
  from = "/api/chiffrage"
  to = "/.netlify/functions/chiffrage-nudura"
  status = 200

# Fonction de generation et lecture de documents
[[redirects]]
  from = "/api/document"
  to = "/.netlify/functions/document"
  status = 200

# Cache long sur les medias : ils ne changent jamais (nom horodate)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
