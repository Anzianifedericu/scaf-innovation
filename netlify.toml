# Fonctions serverless — le moteur de chiffrage y est appelé côté serveur
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["nudura-engine.js"]

# URL courte pour les appels Make / Telegram
[[redirects]]
  from = "/api/chiffrage"
  to = "/.netlify/functions/chiffrage-nudura"
  status = 200

# Fonction de generation et lecture de documents
[[redirects]]
  from = "/api/document"
  to = "/.netlify/functions/document"
  status = 200

# Cache long pour les medias deposes dans le depot : leur nom porte un
# horodatage, ils ne changent donc jamais. Actuellement inutilise, les
# medias de /fr etant servis depuis Supabase Storage.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le manifeste doit porter son propre type MIME, sinon certains telephones
# refusent de proposer l'installation sur l'ecran d'accueil.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Le service worker commande la mise a jour du site installe : il ne doit
# jamais etre servi depuis un cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Audit 07/09/2026 : une seule URL par page (sans .html), sinon Google
# indexe des doublons. /tracer est fusionne dans le calculateur.
[[redirects]]
  from = "/tracer"
  to = "/calculateur"
  status = 301
  force = true

[[redirects]]
  from = "/tracer.html"
  to = "/calculateur"
  status = 301
  force = true

[[redirects]]
  from = "/calculateur.html"
  to = "/calculateur"
  status = 301
  force = true

[[redirects]]
  from = "/demande-etude-nudura.html"
  to = "/demande-etude-nudura"
  status = 301
  force = true

[[redirects]]
  from = "/texsa.html"
  to = "/texsa"
  status = 301
  force = true

[[redirects]]
  from = "/catalogue-entretien-corse"
  to = "/ouvrir-un-commerce-corse"
  status = 301
